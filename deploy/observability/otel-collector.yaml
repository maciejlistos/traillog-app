receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

  transform/metrics:
    metric_statements:
      - context: datapoint
        statements:
          - set(
            attributes["service_name"],
            resource.attributes["service.name"]
            )

          - set(
            attributes["deployment_environment"],
            resource.attributes["deployment.environment.name"]
            )

  batch:
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: tempo:4317

    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

    enable_open_metrics: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check

  pipelines:
    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - otlp/tempo

    metrics:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - transform/metrics
        - batch

      exporters:
        - prometheus
