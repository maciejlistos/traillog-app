apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

    isDefault: true

    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      timeInterval: 5s

      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200

    jsonData:
      nodeGraph:
        enabled: true
