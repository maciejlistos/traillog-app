{{define "partials/header.html"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{if .Title}}{{.Title}} · {{end}}TrailLog</title>

    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">

   <meta
      name="htmx-config"
      content='{
        "historyRestoreAsHxRequest": false,
        "responseHandling": [
            {"code":"204", "swap":false},
            {"code":"[23]..", "swap":true},
            {"code":"413", "swap":true},
            {"code":"422", "swap":true},
            {"code":"[45]..", "swap":false, "error":true},
            {"code":"...", "swap":false}
        ]
    }'
    />

  </head>

  <body class="min-h-screen bg-stone-50 text-stone-900">
    <header class="border-b border-stone-200 bg-white">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4"
      >
        <a
          href="/hikes"
          class="text-xl font-semibold tracking-tight text-emerald-800"
        >
          TrailLog
        </a>

        <nav class="flex items-center gap-4">
          <a
            href="/hikes"
            class="text-sm font-medium text-stone-600 hover:text-stone-950"
          >
            Hikes
          </a>

          <a
            href="/stats"
            class="text-sm font-medium text-stone-600 hover:text-stone-950"
          >
            Statistics
          </a>

          <a
            href="/hikes/import"

            class="text-sm font-medium text-stone-600 hover:text-stone-950"
          >
            Import GPX
          </a>


          <a
            href="/hikes/new"
            class="rounded-lg bg-emerald-700 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2"
          >
            Add hike
          </a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-10">{{end}}</main>
  </body>
</html>
