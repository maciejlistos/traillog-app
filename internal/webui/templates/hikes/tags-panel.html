{{ define "hikes/tags-panel.html" }}
  <section
    id="hike-tags-panel"
    class="
        mt-8 rounded-2xl
        border border-stone-200
        bg-white p-6
        shadow-sm
    "
  >
    <div>
      <h2
        class="
                text-xl font-semibold
                text-stone-950
            "
      >
        Tags
      </h2>

      <p
        class="
                mt-1 text-sm
                text-stone-500
            "
      >
        Add comma-separated labels to organize this hike.
      </p>
    </div>

    {{ if .Tags }}

      <div
        class="
            mt-4 flex flex-wrap gap-2
        "
      >
        {{ range .Tags }}

          <span
            class="
                rounded-full
                bg-emerald-50
                px-3 py-1
                text-sm font-medium
                text-emerald-800
            "
          >
            #{{ .Name }}
          </span>
        {{ end }}
      </div>
    {{ end }}


    <form
      method="post"
      action="/hikes/{{ .HikeID }}/tags"
      hx-post="/hikes/{{ .HikeID }}/tags"
      hx-target="#hike-tags-panel"
      hx-swap="outerHTML"
      class="mt-6"
    >
      <label
        for="tags"
        class="
                block text-sm font-medium
                text-stone-700
            "
      >
        Tags
      </label>

      <input
        id="tags"
        name="tags"
        type="text"
        value="{{ .Form.Tags }}"
        placeholder="forest, macro, quiet"
        class="
                mt-2 block w-full
                rounded-lg
                border border-stone-300
                px-3 py-2
                shadow-sm
                outline-none
                focus:border-emerald-600
                focus:ring-2
                focus:ring-emerald-600/20
            "
      />

      {{ with index .Form.Errors "tags" }}
        <p
          class="
                mt-2 text-sm
                text-red-700
            "
        >
          {{ . }}
        </p>
      {{ end }}


      <button
        type="submit"
        class="
                mt-4 rounded-lg
                bg-emerald-700
                px-4 py-2
                text-sm font-semibold
                text-white
                hover:bg-emerald-800
            "
      >
        Save tags
      </button>
    </form>
  </section>
{{ end }}
