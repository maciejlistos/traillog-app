{{define "error.html"}} {{template "partials/header.html" .}}

<div class="mx-auto max-w-xl py-16 text-center">
  <p class="text-sm font-semibold uppercase tracking-wider text-red-700">
    Something went wrong
  </p>

  <h1 class="mt-3 text-3xl font-bold tracking-tight text-stone-950">
    {{.Title}}
  </h1>

  <p class="mt-4 leading-7 text-stone-600">{{.Message}}</p>

  {{if .RequestID}}
  <p class="mt-6 text-xs text-stone-400">
    Request ID:
    <code>{{.RequestID}}</code>
  </p>
  {{end}}

  <a
    href="/hikes"
    class="mt-8 inline-flex rounded-lg bg-emerald-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800"
  >
    Return to hikes
  </a>
</div>

{{template "partials/footer.html" .}} {{end}}
