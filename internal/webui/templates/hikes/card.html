{{define "hikes/card.html"}}

<article
  id="hike-{{.ID}}"
  class="flex flex-col rounded-xl border border-stone-200 bg-white p-6 shadow-sm"
>
  <div class="mb-4">
    {{if eq .Status.String "visited"}}

    <span
      class="inline-flex rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-800"
    >
      Visited
    </span>

    {{else}}

    <span
      class="inline-flex rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-800"
    >
      Planned
    </span>

    {{end}}
  </div>

  <h2 class="text-xl font-semibold text-stone-950">
    <a href="/hikes/{{.ID}}" class="hover:text-emerald-700"> {{.Name}} </a>
  </h2>

  <p class="mt-1 text-sm text-stone-500">{{.Location}}</p>

  {{if .Tags}}
  <div class="mt-3 flex flex-wrap gap-2" aria-label="Tags">
    {{range .Tags}}
    <span
      class="inline-flex rounded-full bg-stone-100 px-2.5 py-1 text-xs font-medium text-stone-700"
    >
      {{.Name}}
    </span>
    {{end}}
  </div>
  {{end}}

  {{if .Description}}
  <p class="mt-4 line-clamp-3 text-sm leading-6 text-stone-600">
    {{.Description}}
  </p>
  {{end}}

  <div
    class="mt-auto flex items-center justify-between border-t border-stone-100 pt-5"
  >
    <span class="text-sm text-stone-500"> {{formatDistance .DistanceKM}} </span>

    <a
      href="/hikes/{{.ID}}"
      class="text-sm font-medium text-emerald-700 hover:text-emerald-900"
    >
      View details →
    </a>
  </div>
</article>

{{end}}
