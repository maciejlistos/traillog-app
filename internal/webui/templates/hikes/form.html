{{define "hikes/form.html"}}

<form
    method="post"
    action="{{.Action}}"

    {{if .HTMX}}
  
      {{if eq .Mode "create"}}
      hx-post="{{.Action}}"
      {{else}}
      hx-put="{{.Action}}"
      {{end}}

      hx-target="#{{.PanelID}}"
      hx-swap="outerHTML"
      hx-disable-elt="find button[type='submit']"

    {{end}}

    class="space-y-6"
>
    <div>
        <label
            for="name"
            class="
                block text-sm font-medium
                text-stone-800
            "
        >
            Name
        </label>

        <input
            id="name"
            name="name"
            type="text"
            value="{{.Form.Name}}"
            autofocus
            class="
                mt-2 block w-full
                rounded-lg
                border border-stone-300
                bg-white px-3 py-2
                text-stone-900
                shadow-sm
                outline-none
                focus:border-emerald-600
                focus:ring-2
                focus:ring-emerald-600/20
            "
        >

        {{with index .Form.Errors "name"}}
        <p class="mt-2 text-sm text-red-700">
            {{.}}
        </p>
        {{end}}
    </div>

    <div>
        <label
            for="location"
            class="
                block text-sm font-medium
                text-stone-800
            "
        >
            Location
        </label>

        <input
            id="location"
            name="location"
            type="text"
            value="{{.Form.Location}}"
            class="
                mt-2 block w-full
                rounded-lg
                border border-stone-300
                bg-white px-3 py-2
                text-stone-900
                shadow-sm
                outline-none
                focus:border-emerald-600
                focus:ring-2
                focus:ring-emerald-600/20
            "
        >

        {{with index .Form.Errors "location"}}
        <p class="mt-2 text-sm text-red-700">
            {{.}}
        </p>
        {{end}}
    </div>

    <div>
        <label
            for="description"
            class="
                block text-sm font-medium
                text-stone-800
            "
        >
            Description
        </label>

        <textarea
            id="description"
            name="description"
            rows="5"
            class="
                mt-2 block w-full
                rounded-lg
                border border-stone-300
                bg-white px-3 py-2
                text-stone-900
                shadow-sm
                outline-none
                focus:border-emerald-600
                focus:ring-2
                focus:ring-emerald-600/20
            "
        >{{.Form.Description}}</textarea>
    </div>

    <div
        class="
            grid gap-6
            sm:grid-cols-2
        "
    >
        <div>
            <label
                for="distance_km"
                class="
                    block text-sm font-medium
                    text-stone-800
                "
            >
                Distance
            </label>

            <div class="relative mt-2">
                <input
                    id="distance_km"
                    name="distance_km"
                    type="text"
                    inputmode="decimal"
                    value="{{.Form.DistanceKM}}"
                    placeholder="8.4"
                    class="
                        block w-full
                        rounded-lg
                        border border-stone-300
                        bg-white
                        px-3 py-2 pr-12
                        text-stone-900
                        shadow-sm
                        outline-none
                        focus:border-emerald-600
                        focus:ring-2
                        focus:ring-emerald-600/20
                    "
                >

                <span
                    class="
                        absolute right-3 top-2
                        text-stone-400
                    "
                >
                    km
                </span>
            </div>

            {{with index .Form.Errors "distance_km"}}
            <p class="mt-2 text-sm text-red-700">
                {{.}}
            </p>
            {{end}}
        </div>

        <div>
            <label
                for="status"
                class="
                    block text-sm font-medium
                    text-stone-800
                "
            >
                Status
            </label>

            <select
                id="status"
                name="status"
                class="
                    mt-2 block w-full
                    rounded-lg
                    border border-stone-300
                    bg-white px-3 py-2
                    text-stone-900
                    shadow-sm
                    outline-none
                    focus:border-emerald-600
                    focus:ring-2
                    focus:ring-emerald-600/20
                "
            >
                <option
                    value="planned"
                    {{if eq .Form.Status "planned"}}
                    selected
                    {{end}}
                >
                    Planned
                </option>

                <option
                    value="visited"
                    {{if eq .Form.Status "visited"}}
                    selected
                    {{end}}
                >
                    Visited
                </option>
            </select>

            {{with index .Form.Errors "status"}}
            <p class="mt-2 text-sm text-red-700">
                {{.}}
            </p>
            {{end}}
        </div>
    </div>

    <div
        class="
            flex items-center justify-end
            gap-3 border-t
            border-stone-200 pt-6
        "
    >
        <a
            href="/hikes"
            class="
                rounded-lg px-4 py-2
                text-sm font-medium
                text-stone-600
                hover:bg-stone-100
                hover:text-stone-900
            "
        >
            Cancel
        </a>

        <button
            type="submit"
            class="
                rounded-lg
                bg-emerald-700
                px-5 py-2.5
                text-sm font-semibold
                text-white
                hover:bg-emerald-800
                focus:outline-none
                focus:ring-2
                focus:ring-emerald-600
                focus:ring-offset-2
            "
        >
        <span>
          {{.SubmitLabel}}
        </span>

        {{if .HTMX}}
        <span
          class="htmx-indicator ml-2 text-emerald-100"
        >
          Saving ...
        </span>
        {{end}}
        </button>
    </div>
</form>

{{end}}
