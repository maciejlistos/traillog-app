{{define "hikes/detail.html"}}

<article
  id="hike-detail"
  class="rounded-2xl border border-stone-200 bg-white p-8 shadow-sm"
>
  <div class="flex items-start justify-between gap-6">
    <div>
      {{if eq .Hike.Status.String "visited"}}

      <span
        class="inline-flex rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-800"
      >
        Visited
      </span>

      {{else}}

      <span
        class="inline-flex rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-800"
      >
        Planned
      </span>

      {{end}}
    </div>

    <div class="flex items-center gap-3">
      <a
        href="/hikes/{{.Hike.ID}}/edit"
        hx-get="/hikes/{{.Hike.ID}}/edit"
        hx-target="#hike-detail"
        hx-swap="outerHTML"
        class="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-stone-700 hover:bg-stone-50"
      >
        Edit
      </a>

      <form method="post" action="/hikes/{{.Hike.ID}}/delete">
        <button
          type="submit"
          class="rounded-lg border border-red-200 px-4 py-2 text-sm font-medium text-red-700 hover:bg-red-50"
        >
          Delete
        </button>
      </form>
    </div>
  </div>

  <h1 class="mt-4 text-3xl font-bold tracking-tight">{{.Hike.Name}}</h1>

  <p class="mt-2 text-lg text-stone-500">{{.Hike.Location}}</p>

  <div
    class="mt-auto flex items-center justify-between gap-4 border-t border-stone-100 pt-5"
  >
    <span class="text-sm text-stone-500">
      {{formatDistance .Hike.DistanceKM}}
    </span>

    <div class="flex items-center gap-3">
      <a
        href="/hikes/{{.Hike.ID}}"
        class="text-sm font-medium text-emerald-700 hover:text-emerald-900"
      >
        View
      </a>

      <form method="post" action="/hikes/{{.Hike.ID}}/delete">
        <button
          type="submit"
          hx-delete="/hikes/{{.Hike.ID}}"
          hx-target="#hike-{{.Hike.ID}}"
          hx-swap="outerHTML"
          hx-confirm="Delete this hike?"
          class="text-sm font-medium text-red-700 hover:text-red-900"
        >
          Delete
        </button>
      </form>
    </div>
  </div>
</article>

{{end}}
